name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Worker integration tests (local D1, mocked bindings)
        run: npm run test:workers

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Dummy dev secrets for E2E (push/Giphy are mocked or unused)
        run: |
          if [ ! -f .dev.vars ]; then
            printf 'VAPID_PRIVATE_KEY={}\nGIPHY_API_KEY=test\n' > .dev.vars
          fi

      - name: Migrate E2E database
        run: npm run db:migrate:e2e

      - name: End-to-end tests (Chromium)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
